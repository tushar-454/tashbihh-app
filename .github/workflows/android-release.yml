name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the publishing job can write releases. No personal access token is needed.
permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version_code: ${{ steps.plan.outputs.version_code }}
      version_name: ${{ steps.plan.outputs.version_name }}
      tag: ${{ steps.plan.outputs.tag }}
      apk_name: ${{ steps.plan.outputs.apk_name }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect app changes and choose the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional migration floor: highest versionCode distributed outside this workflow.
          ANDROID_VERSION_CODE_FLOOR: ${{ vars.ANDROID_VERSION_CODE_FLOOR }}
        run: python3 tool/android_release.py plan

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      APK_NAME: ${{ needs.plan.outputs.apk_name }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate production signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 tool/android_release.py signing
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches this project's Dart ^3.13.7 requirement and locally verified SDK.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate release automation
        run: python3 -m unittest discover -s tool/tests -v
      - name: Analyze and test app
        run: |
          flutter analyze
          flutter test
      - name: Build one universal signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Keep normal pub/tooling regeneration: this SDK's --no-pub path can
          # leave integration_test in the generated release plugin registrant.
          flutter build apk --release \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE"
      - name: Verify signature, identity, version, and universal APK contents
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tool/android_release.py verify
      - name: Publish a new release with APK and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/android_release.py publish
      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-release.jks"
